<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRONSCALES Champions Cup 2026</title>
<meta property="og:title" content="IRONSCALES Champions Cup 2026">
<meta property="og:description" content="Defenders of the Inbox — join the pitch.">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#07090f;
  font-family:'Inter',sans-serif;
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── HERO ── */
.hero{
  position:relative;
  overflow:hidden;
  padding:40px 24px 30px;
  text-align:center;
  background:radial-gradient(ellipse 120% 80% at 50% -10%,#1a2c5a 0%,#07090f 65%);
  border-bottom:1px solid rgba(201,168,76,0.3);
}
.hero::before{
  content:'';
  position:absolute;
  top:-80px;left:50%;
  transform:translateX(-50%);
  width:1000px;height:500px;
  background:conic-gradient(
    from -8deg at 50% 0%,
    transparent 18%,rgba(201,168,76,0.07) 23%,transparent 28%,
    transparent 38%,rgba(201,168,76,0.07) 43%,transparent 48%
  );
  pointer-events:none;
}
.hero-logo{
  height:38px;
  margin-bottom:14px;
  filter:brightness(1.1);
}
.hero-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(2.2rem,6vw,4rem);
  letter-spacing:4px;
  color:#f5d76e;
  text-shadow:0 0 40px rgba(245,215,110,0.4);
  line-height:1;
}
.hero-tagline{
  font-family:'Rajdhani',sans-serif;
  font-size:1rem;
  letter-spacing:4px;
  color:#8899aa;
  text-transform:uppercase;
  margin-top:8px;
}

/* ── COUNTER ── */
.counter-section{
  background:#0b0e1a;
  border-bottom:1px solid rgba(201,168,76,0.2);
  padding:24px 20px;
  text-align:center;
}
.counter-label{
  font-family:'Rajdhani',sans-serif;
  font-size:0.8rem;
  letter-spacing:3px;
  color:#556;
  text-transform:uppercase;
  margin-bottom:10px;
}
.counter-number{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(3rem,8vw,5rem);
  line-height:1;
  color:#f5d76e;
}
.counter-slash{
  color:#2a3040;
  margin:0 4px;
}
.counter-goal{
  color:#2a3040;
}
.counter-bar-wrap{
  width:min(500px,85%);
  height:6px;
  background:#1a2035;
  border-radius:3px;
  margin:12px auto 8px;
  overflow:hidden;
}
.counter-bar-fill{
  height:100%;
  background:linear-gradient(90deg,#c9a84c,#f5d76e,#ff8c00);
  border-radius:3px;
  transition:width 1.2s cubic-bezier(.4,0,.2,1);
}
.counter-sub{
  font-size:0.72rem;
  color:#444;
  letter-spacing:2px;
  text-transform:uppercase;
}

/* ── SEARCH ── */
.search-wrap{
  padding:20px;
  text-align:center;
  background:#07090f;
}
.search-input{
  padding:10px 22px;
  border-radius:30px;
  border:1px solid rgba(201,168,76,0.4);
  background:#0d1120;
  color:#fff;
  font-size:0.9rem;
  width:min(340px,90%);
  outline:none;
  transition:border-color .2s;
}
.search-input:focus{border-color:#f5d76e;}
.search-input::placeholder{color:#445;}

/* ── GROUPS ── */
.groups-container{
  max-width:1400px;
  margin:0 auto;
  padding:20px 20px 60px;
}
.group-block{margin-bottom:48px;}
.group-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.6rem;
  letter-spacing:4px;
  color:#f5d76e;
  border-left:3px solid #f5d76e;
  padding-left:14px;
  margin-bottom:20px;
}
.group-cards{display:flex;flex-wrap:wrap;gap:22px;}

/* ── FIFA UT CARD ── */
.card-wrap{perspective:900px;}

.card{
  width:214px;
  height:294px;
  border-radius:14px;
  position:relative;
  cursor:pointer;
  overflow:hidden;
  transform-style:preserve-3d;
  transition:transform .12s ease, box-shadow .12s ease;
  box-shadow:0 8px 32px rgba(0,0,0,.7),0 0 20px rgba(201,168,76,.25);

  /* Gold gradient — FIFA UT feel */
  background:
    linear-gradient(160deg,
      #5a3e00 0%,
      #a8720a 12%,
      #d4a420 28%,
      #f5d870 48%,
      #e8c040 62%,
      #b8860b 78%,
      #6b4a00 100%
    );
}

/* Diagonal dark stripe — the signature FUT look */
.card::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(
    -42deg,
    transparent 0%,
    transparent 30%,
    rgba(0,0,0,.28) 30%,
    rgba(0,0,0,.28) 60%,
    transparent 60%
  );
  z-index:1;
  pointer-events:none;
}

/* Shine on hover */
.card-shine{
  position:absolute;
  inset:0;
  border-radius:14px;
  background:linear-gradient(
    125deg,
    rgba(255,255,255,0) 20%,
    rgba(255,255,255,.18) 50%,
    rgba(255,255,255,0) 80%
  );
  opacity:0;
  transition:opacity .2s;
  pointer-events:none;
  z-index:9;
}
.card:hover .card-shine{opacity:1;}

/* Card inner content above the diagonal */
.card-top{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  padding:10px 12px 0;
}

.card-rating-block{
  display:flex;
  flex-direction:column;
  align-items:center;
  line-height:1;
}
.card-rating{
  font-family:'Bebas Neue',sans-serif;
  font-size:2.6rem;
  color:#1a0f00;
  text-shadow:0 1px 0 rgba(255,255,255,.2);
  line-height:1;
}
.card-pos{
  font-family:'Rajdhani',sans-serif;
  font-size:.65rem;
  font-weight:700;
  color:#1a0f00;
  letter-spacing:1px;
}

.card-badges{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
}
.badge-icon{
  width:30px;
  height:30px;
  object-fit:contain;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));
}

/* Logo area */
.card-logo-area{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:center;
  align-items:center;
  height:108px;
  margin-top:2px;
}
.card-logo-img{
  max-width:130px;
  max-height:90px;
  object-fit:contain;
  filter:drop-shadow(0 3px 10px rgba(0,0,0,.5));
}
.card-initials{
  width:80px;
  height:80px;
  border-radius:50%;
  background:rgba(0,0,0,.3);
  border:2px solid rgba(0,0,0,.2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Bebas Neue',sans-serif;
  font-size:1.9rem;
  color:#1a0f00;
}

/* Name */
.card-name-area{
  position:relative;
  z-index:2;
  text-align:center;
  padding:2px 10px;
}
.card-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.1rem;
  letter-spacing:2px;
  color:#1a0f00;
  text-shadow:0 1px 0 rgba(255,255,255,.15);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* Stats / IRONSCALES SECURED bottom strip */
.card-stats{
  position:absolute;
  bottom:0;left:0;right:0;
  background:rgba(0,0,0,.6);
  border-radius:0 0 14px 14px;
  padding:8px 12px 10px;
  z-index:2;
  backdrop-filter:blur(2px);
}
.stats-cols{
  display:flex;
  justify-content:space-between;
  margin-bottom:6px;
}
.stats-col{
  display:flex;
  flex-direction:column;
  gap:3px;
}
.stat-row{
  display:flex;
  align-items:center;
  gap:5px;
}
.stat-val{
  font-family:'Rajdhani',sans-serif;
  font-size:.85rem;
  font-weight:700;
  color:#fff;
  min-width:18px;
  text-align:right;
}
.stat-lbl{
  font-family:'Rajdhani',sans-serif;
  font-size:.72rem;
  font-weight:600;
  color:rgba(255,255,255,.6);
  letter-spacing:.5px;
}

/* IRONSCALES SECURED banner */
.is-secured{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding-top:5px;
  border-top:1px solid rgba(255,255,255,.15);
}
.is-secured-icon{
  width:14px;height:14px;
  object-fit:contain;
}
.is-secured-text{
  font-family:'Rajdhani',sans-serif;
  font-size:.65rem;
  font-weight:700;
  color:rgba(255,255,255,.75);
  letter-spacing:1.5px;
  text-transform:uppercase;
}

/* ── MODAL ── */
.modal-overlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,.85);
  z-index:1000;
  align-items:center;justify-content:center;
  backdrop-filter:blur(6px);
}
.modal-overlay.open{display:flex;}
.modal{
  background:#0d1120;
  border:1px solid rgba(201,168,76,.35);
  border-radius:16px;
  padding:36px;
  max-width:400px;
  width:90%;
  text-align:center;
  position:relative;
}
.modal-close{
  position:absolute;
  top:14px;right:18px;
  background:none;border:none;
  color:#556;font-size:1.4rem;
  cursor:pointer;
  transition:color .2s;
}
.modal-close:hover{color:#fff;}
.modal-logo-wrap{
  width:120px;height:80px;
  margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;
}
.modal-logo{max-width:100%;max-height:100%;object-fit:contain;}
.modal-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:2rem;letter-spacing:3px;
  color:#f5d76e;margin-bottom:6px;
}
.modal-domain{
  font-size:.8rem;color:#556;
  margin-bottom:20px;
}
.modal-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:#0b0e1a;
  border:1px solid rgba(201,168,76,.25);
  border-radius:30px;
  padding:8px 18px;
  margin-bottom:24px;
}
.modal-badge img{width:20px;height:20px;object-fit:contain;}
.modal-badge span{
  font-family:'Rajdhani',sans-serif;
  font-size:.9rem;font-weight:700;
  letter-spacing:2px;color:#f5d76e;
  text-transform:uppercase;
}
.modal-actions{
  display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
}
.btn{
  padding:10px 20px;
  border-radius:8px;
  border:none;cursor:pointer;
  font-family:'Rajdhani',sans-serif;
  font-size:.9rem;font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  transition:opacity .2s,transform .1s;
  text-decoration:none;
  display:inline-flex;align-items:center;gap:8px;
}
.btn:hover{opacity:.85;transform:translateY(-1px);}
.btn-linkedin{background:#0A66C2;color:#fff;}
.btn-copy{background:#1a2035;color:#f5d76e;border:1px solid rgba(201,168,76,.3);}

/* ── FOOTER ── */
.footer{
  text-align:center;
  padding:24px;
  color:#333;
  font-size:.75rem;
  letter-spacing:2px;
  text-transform:uppercase;
  border-top:1px solid #111;
}

/* ── NO RESULTS ── */
.empty{
  text-align:center;
  padding:60px 20px;
  color:#334;
  font-family:'Rajdhani',sans-serif;
  font-size:1.2rem;
  letter-spacing:2px;
}

@media(max-width:480px){
  .card{width:170px;height:234px;}
  .card-rating{font-size:2rem;}
  .card-logo-area{height:84px;}
  .card-logo-img{max-width:100px;max-height:70px;}
  .card-initials{width:64px;height:64px;font-size:1.5rem;}
  .card-name{font-size:.9rem;}
}
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <img class="hero-logo"
    src="https://ironscales.com/hs-fs/hubfs/logo_white.png?width=300&name=logo_white.png"
    alt="IRONSCALES">
  <div class="hero-title" id="promo-name">IRONSCALES CHAMPIONS CUP 2026</div>
  <div class="hero-tagline" id="promo-tagline">Defenders of the Inbox</div>
</div>

<!-- COUNTER -->
<div class="counter-section">
  <div class="counter-label">Inboxes Defended &amp; Counting</div>
  <div class="counter-number">
    <span id="count-current">0</span><span class="counter-slash">/</span><span class="counter-goal" id="count-goal">5,000</span>
  </div>
  <div class="counter-bar-wrap">
    <div class="counter-bar-fill" id="count-bar" style="width:0%"></div>
  </div>
  <div class="counter-sub">Join the pitch — every inbox counts</div>
</div>

<!-- SEARCH -->
<div class="search-wrap">
  <input class="search-input" type="text" id="search"
    placeholder="🔍  Search for a company...">
</div>

<!-- GROUPS -->
<div class="groups-container" id="groups-container">
  <div class="empty">Loading champions...</div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">✕</button>
    <div class="modal-logo-wrap">
      <img class="modal-logo" id="modal-logo" src="" alt="">
    </div>
    <div class="modal-name" id="modal-name"></div>
    <div class="modal-domain" id="modal-domain"></div>
    <div class="modal-badge">
      <img src="https://ironscales.com/hubfs/IS-favicon-01.png" alt="IS">
      <span>IRONSCALES Secured</span>
    </div>
    <div class="modal-actions">
      <a class="btn btn-linkedin" id="modal-linkedin" href="#" target="_blank">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.37V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.59 0 4.25 2.37 4.25 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zm1.78 13.02H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45C23.21 24 24 23.23 24 22.27V1.73C24 .77 23.21 0 22.22 0z"/></svg>
        Share on LinkedIn
      </a>
      <button class="btn btn-copy" id="modal-copy" onclick="copyLink()">
        🔗 Copy Link
      </button>
    </div>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">Updated daily · All clients are Champions · Powered by IRONSCALES</div>

<script>
// ── Helpers ──────────────────────────────────────────────────────
function hashStr(s){
  let h=0;
  for(let i=0;i<s.length;i++) h=(Math.imul(31,h)+s.charCodeAt(i))|0;
  return Math.abs(h);
}

// Security rating 87–99 per domain
function secRating(domain){
  return 87 + (hashStr(domain) % 13);
}

// 6 IS-themed stats, slightly varied per domain
function secStats(domain){
  const h = hashStr(domain);
  const base = [97,96,98,95,99,97];
  const labels = [['PAC','SHO','PAS'],['DRI','DEF','PHY']];
  return {
    left:  labels[0].map((l,i)=>({lbl:l, val: Math.min(99, base[i]   - (h>>(i*4)&3))})),
    right: labels[1].map((l,i)=>({lbl:l, val: Math.min(99, base[i+3] - (h>>(i*4+12)&3))}))
  };
}

function initials(name){
  return name.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

// ── Build Card ───────────────────────────────────────────────────
function buildCard(team){
  const rating = secRating(team.domain);
  const stats  = secStats(team.domain);
  const ini    = initials(team.name || team.domain);
  const logoSrc= team.logo || ('https://logo.clearbit.com/'+team.domain);

  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.dataset.domain = team.domain;

  const card = document.createElement('div');
  card.className = 'card';
  card.title = team.name;

  // shine
  const shine = document.createElement('div');
  shine.className = 'card-shine';
  card.appendChild(shine);

  // top row
  const top = document.createElement('div');
  top.className = 'card-top';

  const ratingBlock = document.createElement('div');
  ratingBlock.className = 'card-rating-block';
  const ratingEl = document.createElement('span');
  ratingEl.className = 'card-rating';
  ratingEl.textContent = rating;
  const posEl = document.createElement('span');
  posEl.className = 'card-pos';
  posEl.textContent = 'MSP';
  ratingBlock.appendChild(ratingEl);
  ratingBlock.appendChild(posEl);

  const badges = document.createElement('div');
  badges.className = 'card-badges';
  const badgeImg = document.createElement('img');
  badgeImg.className = 'badge-icon';
  badgeImg.src = 'https://ironscales.com/hubfs/IS-favicon-01.png';
  badgeImg.alt = 'IS';
  badges.appendChild(badgeImg);

  top.appendChild(ratingBlock);
  top.appendChild(badges);
  card.appendChild(top);

  // logo area
  const logoArea = document.createElement('div');
  logoArea.className = 'card-logo-area';

  const img = document.createElement('img');
  img.className = 'card-logo-img';
  img.src = logoSrc;
  img.loading = 'lazy';
  img.alt = team.name;

  const fallback = document.createElement('div');
  fallback.className = 'card-initials';
  fallback.textContent = ini;
  fallback.style.display = 'none';

  img.addEventListener('error', ()=>{
    img.style.display = 'none';
    fallback.style.display = 'flex';
  });

  logoArea.appendChild(img);
  logoArea.appendChild(fallback);
  card.appendChild(logoArea);

  // name
  const nameArea = document.createElement('div');
  nameArea.className = 'card-name-area';
  const nameEl = document.createElement('div');
  nameEl.className = 'card-name';
  nameEl.textContent = (team.name || team.domain).toUpperCase();
  nameArea.appendChild(nameEl);
  card.appendChild(nameArea);

  // stats
  const statsEl = document.createElement('div');
  statsEl.className = 'card-stats';

  const cols = document.createElement('div');
  cols.className = 'stats-cols';

  [stats.left, stats.right].forEach(col=>{
    const colEl = document.createElement('div');
    colEl.className = 'stats-col';
    col.forEach(s=>{
      const row = document.createElement('div');
      row.className = 'stat-row';
      const val = document.createElement('span');
      val.className = 'stat-val';
      val.textContent = s.val;
      const lbl = document.createElement('span');
      lbl.className = 'stat-lbl';
      lbl.textContent = s.lbl;
      row.appendChild(val);
      row.appendChild(lbl);
      colEl.appendChild(row);
    });
    cols.appendChild(colEl);
  });
  statsEl.appendChild(cols);

  // IS SECURED banner
  const secured = document.createElement('div');
  secured.className = 'is-secured';
  const secIcon = document.createElement('img');
  secIcon.className = 'is-secured-icon';
  secIcon.src = 'https://ironscales.com/hubfs/IS-favicon-01.png';
  secIcon.alt = 'IS';
  const secText = document.createElement('span');
  secText.className = 'is-secured-text';
  secText.textContent = 'IRONSCALES SECURED';
  secured.appendChild(secIcon);
  secured.appendChild(secText);
  statsEl.appendChild(secured);

  card.appendChild(statsEl);

  // 3D tilt on mouse
  wrap.addEventListener('mousemove', e=>{
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width  - 0.5;
    const y = (e.clientY - r.top)  / r.height - 0.5;
    card.style.transform = `rotateY(${x*18}deg) rotateX(${-y*18}deg) scale(1.06)`;
    card.style.boxShadow = `${-x*20}px ${y*20}px 40px rgba(0,0,0,.8),0 0 30px rgba(201,168,76,.4)`;
  });
  wrap.addEventListener('mouseleave', ()=>{
    card.style.transform = '';
    card.style.boxShadow = '';
  });

  // click → modal
  card.addEventListener('click', ()=> openModal(team, logoSrc));
  wrap.appendChild(card);
  return wrap;
}

// ── Modal ────────────────────────────────────────────────────────
let currentDomain = '';
function openModal(team, logoSrc){
  currentDomain = team.domain;
  document.getElementById('modal-logo').src = logoSrc || team.logo || ('https://logo.clearbit.com/'+team.domain);
  document.getElementById('modal-name').textContent = (team.name||team.domain).toUpperCase();
  document.getElementById('modal-domain').textContent = team.domain;
  const shareUrl = location.origin+location.pathname+'#'+team.domain;
  document.getElementById('modal-linkedin').href =
    'https://www.linkedin.com/sharing/share-offsite/?url='+encodeURIComponent(shareUrl);
  document.getElementById('modal').classList.add('open');
  history.replaceState(null,'','#'+team.domain);
}
function closeModal(e){
  if(e.target===document.getElementById('modal'))
    document.getElementById('modal').classList.remove('open');
}
function copyLink(){
  const url = location.origin+location.pathname+'#'+currentDomain;
  navigator.clipboard.writeText(url).catch(()=>{});
  const btn = document.getElementById('modal-copy');
  btn.textContent='✓ Copied!';
  setTimeout(()=>btn.textContent='🔗 Copy Link',2000);
}

// ── Render groups ────────────────────────────────────────────────
let allTeams = [];
function renderGroups(teams){
  const container = document.getElementById('groups-container');
  container.innerHTML = '';
  if(!teams.length){
    container.innerHTML = '<div class="empty">No champions found</div>';
    return;
  }
  const sorted = [...teams].sort((a,b)=>a.domain.localeCompare(b.domain));
  const size = 4;
  for(let i=0;i<sorted.length;i+=size){
    const chunk = sorted.slice(i,i+size);
    const groupLetter = String.fromCharCode(65+Math.floor(i/size));
    const block = document.createElement('div');
    block.className = 'group-block';
    const title = document.createElement('div');
    title.className = 'group-title';
    title.textContent = 'Group '+groupLetter;
    const cards = document.createElement('div');
    cards.className = 'group-cards';
    chunk.forEach(t=> cards.appendChild(buildCard(t)));
    block.appendChild(title);
    block.appendChild(cards);
    container.appendChild(block);
  }
}

// ── Search ───────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e=>{
  const q = e.target.value.toLowerCase().trim();
  renderGroups(q ? allTeams.filter(t=>
    (t.name||'').toLowerCase().includes(q) ||
    t.domain.toLowerCase().includes(q)
  ) : allTeams);
});

// ── Counter ──────────────────────────────────────────────────────
function animateCounter(current, goal){
  const el = document.getElementById('count-current');
  const bar = document.getElementById('count-bar');
  const pct = goal > 0 ? Math.min(100, (current/goal)*100) : 0;
  let n = 0;
  const step = Math.ceil(current/60);
  const timer = setInterval(()=>{
    n = Math.min(n+step, current);
    el.textContent = n.toLocaleString();
    if(n>=current) clearInterval(timer);
  },16);
  bar.style.width = pct+'%';
  document.getElementById('count-goal').textContent = goal.toLocaleString();
}

// ── Fetch & init ─────────────────────────────────────────────────
fetch('./teams.json?v='+Date.now())
  .then(r=>r.json())
  .then(data=>{
    // promo info
    if(data.promotion){
      if(data.promotion.name)
        document.getElementById('promo-name').textContent = data.promotion.name.toUpperCase();
      if(data.promotion.tagline)
        document.getElementById('promo-tagline').textContent = data.promotion.tagline;
      document.title = data.promotion.name || 'IRONSCALES Champions Cup 2026';
      animateCounter(
        data.promotion.secured_count || 0,
        data.promotion.secured_goal  || 5000
      );
    }
    allTeams = data.teams || [];
    renderGroups(allTeams);

    // deep link
    if(location.hash){
      const d = location.hash.slice(1);
      const team = allTeams.find(t=>t.domain===d);
      if(team) setTimeout(()=>openModal(team, team.logo||('https://logo.clearbit.com/'+team.domain)),400);
    }
  })
  .catch(()=>{
    document.getElementById('groups-container').innerHTML =
      '<div class="empty">Could not load teams — check teams.json</div>';
  });
</script>
</body>
</html>
