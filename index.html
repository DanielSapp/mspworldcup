entById('modal'))cM();}document.addEventListener('keydown',function(e){if(e.key==='Escape')cM();});function copyLink(){if(!aT)return;navigator.clipboard.writeText(location.origin+location.pathname+'#'+aT.domain).then(function(){sT('Link copied!');});}function shareLinkedIn(){if(!aT)return;var u=encodeURIComponent(location.origin+location.pathname+'#'+aT.domain),t=encodeURIComponent((aT.name||aT.domain)+' joined the IRONSCALES Champions Cup 2026! #EmailSecurity #IRONSCALES');window.open('https://www.linkedin.com/sharing/share-offsite/?url='+u+'&summary='+t,'_blank');}var tT;function sT(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(tT);tT=setTimeout(function(){e.classList.remove('show');},2800);}function fT(q){q=q.toLowerCase().trim();document.querySelectorAll('.card-wrap').forEach(function(w){w.classList.toggle('hidden',!(!q||w.dataset.domain.includes(q)||(w.dataset.name||'').toLowerCase().includes(q)));});document.querySelectorAll('.group-block').forEach(function(b){b.style.display=Array.from(b.querySelectorAll('.card-wrap')).some(function(w){return!w.classList.contains('hidden');})?'':'none';});}function filterTeams(q){fT(q);}async function init(){var res=await fetch('./teams.json?v='+Date.now());if(!res.ok)throw new Error('HTTP '+res.status);var d=await res.json(),teams=d.teams||[];document.getElementById('hero-pill').textContent=teams.length+' Champion'+(teams.length!==1?'s':'')+' Defending the Inbox';var groups=BG(teams),page=document.getElementById('page');page.innerHTML='';Object.entries(groups).forEach(function(e){var letter=e[0],gT=e[1],bl=document.createElement('div');bl.className='group-block';var hd=document.createElement('div');hd.className='group-header';hd.innerHTML='<span class="group-letter">Group '+letter+'</span><div class="group-rule"></div><span class="group-count">'+gT.length+' Teams</span>';bl.appendChild(hd);var row=document.createElement('div');row.className='group-teams';gT.forEach(function(te
